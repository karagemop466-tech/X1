name: verify-site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild derived availability table
        run: python3 tools/build_availability.py

      - name: Fail if the derived table is stale
        run: git diff --exit-code -- data/nfl/availability_derived.tsv

      # Added by session arena-73e6cbac-x1 (additive only). The decision-readiness register
      # must be reproducible: rebuild it and fail if the committed JSON/CSV differs, then
      # re-diff the published standings against the dated 2026-11-15 official transcription.
      # A stale register would silently publish yesterday's "current value" as today's.
      - name: Rebuild the decision-readiness register and fail if stale
        run: |
          # --check compares every field except generated_at, so the guard tests the
          # register's CONTENT and not the wall-clock timestamp of the last build.
          # (A plain rebuild always differs on generated_at, which would make this
          # step fail on every commit — including a no-op one.)
          python3 tools/build_decision_readiness.py --check

      - name: Re-diff the published standings against the 2026-11-15 official read
        run: |
          # Same reason: --check compares content, ignoring the build timestamp.
          python3 tools/verify_2026_11_15.py --check

      - name: Line-by-line integrity checks
        run: python3 tools/verify_data.py

      - name: Rebuild the site
        run: python3 tools/build_site.py

      - name: Fail if committed HTML is stale
        run: git diff --exit-code -- index.html pages

      - name: Link and structure check
        run: python3 tools/check_links.py

      - name: Shared source-link rule
        run: python3 scripts/verify_site.py
      # Added by session arena-34b79d69-x1 (additive only): the canonical decision
      # center is generated from a source-linked register; a hand-edited page fails here.
      - name: Verify the decision-center register and pages
        run: |
          python3 tools/build_decision_center.py --check
          python3 tools/verify_decision_center.py

      - name: Prove the source-link rule can fail (mutation test)
        run: python3 tools/test_source_rule.py

      - name: Second independent transcription cross-check
        run: python3 tools/cross_check.py

      - name: Parlay correlation regression (Frechet bounds, nested legs)
        run: python3 scripts/verify_parlay.py

      # Added by session arena/9cc1eaac-x1: diff every published Week 10 cell against an
      # independent re-transcription of the official pages. Any contradiction fails the
      # build. This is the check that cannot be satisfied by two transcriptions sharing a
      # misread, which is the limitation flag F-13 records.
      - name: Published data vs the official pages (independent re-transcription)
        run: python3 tools/verify_against_official.py

      # Added by session arena/fcc11e05-x1 (additive only). The unified dashboard's own
      # contract: every internal link resolves and every data row carries a source link
      # or an explicit "no official source" marker. Also runs in pages.yml, before deploy.
      - name: Verify the unified dashboard
        run: python3 tools/verify_app.py

      - name: Rebuild the unified dashboard
        run: python3 tools/build_app.py

      - name: Fail if the committed dashboard is stale
        run: git diff --exit-code -- app

      # Added by session arena/600e6009-x1 (round 3, additive only): rebuild the
      # results feed, the price-snapshot store, the origination-order table and the
      # signal/staking + depth + correlation registers. Each builder aborts if an
      # invariant breaks (row diff vs the publishing mirror, standings arithmetic,
      # official hosts only, origination order 1-2-3, market columns blank while no
      # official price source exists); --check then fails if the commit is stale.
      - name: Rebuild round-3 feeds (results, snapshots, origination, registers)
        run: |
          python3 tools/build_results_r3.py --check
          python3 tools/build_snapshots.py --check
          python3 tools/build_origination.py --check
          python3 tools/build_round3.py --check

      # Registers behind the decision, suggestions, review-queue and requirements pages.
      # Rebuilding them here proves the committed JSON is reproducible from the data.
      - name: Rebuild audit registers
        run: python3 tools/build_audit_registers.py

      - name: Fail if the audit registers are stale
        run: git diff --exit-code -- data/audit

      # Added by session arena/fb9e0427-x1 (round 4, additive only). The decision-readiness register:
      # one row per requirement, with every measured value recomputed from a named file. --check fails
      # if the committed data/audit/readiness.json differs from a fresh build.
      - name: Decision-readiness register is reproducible
        run: python3 tools/build_state_audit.py --check

      # Added by session arena/56769365-x1 (additive only). The line desk (lab/) is a seventh
      # page tree with its own contract: links resolve, every data row carries a source link,
      # no Python value leaks into a cell. It also fails if the committed pages are stale
      # against a fresh build, so a hand-edited page cannot ship.
      - name: Rebuild the line desk and verify its contract
        run: python3 tools/lab/build_site.py

      - name: Fail if the committed line desk is stale
        run: git diff --exit-code -- lab

      - name: Parallel session's dashboard checks
        run: python3 scripts/check_site.py

      - name: Research lab checks (links, contracts, placeholders)
        run: python3 scripts/verify_research_site.py

      - name: Snapshot annex checks (session arena/a78e0158-x1)
        run: python3 scripts/verify_site_annex.py

      - name: Validate JSON registers
        run: |
          for f in data/*.json; do
            python3 -c "import json,sys; json.load(open('$f')); print('ok $f')"
          done

      # Added by session arena/907c5baf-x1: round-2 store contract (results feed,
      # price snapshots, signal/staking split, demotion gate). Additive.
      - name: Verify round-2 store contract (Added by session arena/907c5baf-x1)
        run: python3 tools/verify_stores.py

      # Added by session arena/b03ced7c-x1 (additive only). The Week 10 official
      # re-capture, the depth-parse measurement, the readiness table and the flags
      # register are rebuilt from their inputs; then every published number is
      # re-derived and compared. A re-capture that drifts from its transcription, a
      # depth row silently cleaned, or a readiness row without a source fails here
      # rather than shipping.
      - name: Rebuild the Week 10 re-capture, depth parse and readiness table
        run: |
          set -euo pipefail
          python3 tools/official/week10_reconcile.py
          python3 tools/official/depth_parse.py
          python3 tools/official/readiness.py

      - name: Fail if the re-capture, depth parse or readiness files are stale
        run: |
          git diff --exit-code -- data/console/week10_reconcile.json data/console/week10_reconcile.csv data/console/depth_parse.json data/console/depth_parse.csv data/console/readiness.json data/console/readiness.csv

      - name: Verify every published number against the fresh capture
        run: python3 tools/official/verify_published.py

      - name: Rebuild round-2 stores and fail if stale (Added by session arena/907c5baf-x1)
        run: |
          python3 tools/build_results_feed_907c.py
          python3 tools/build_price_store_907c.py
          python3 tools/build_leaderboard_split.py
          python3 tools/build_app.py
          git diff --exit-code -- data/results_feed.json data/price_snapshots.json data/leaderboard_split_907c.json app

      # Added by session arena-3f5badd0-x1 (additive only). Control baselines (random picks,
      # favourites only) pre-registered in docs/lab/control-baselines.md (commit 0747005).
      # --check fails if the committed artefact differs from a fresh computation.
      - name: Control baselines reproduce from the pinned mirror (C1)
        run: python3 tools/lab/build_controls.py --check

      # Added by session arena-543cdcb0-x1 (additive only). The capture store is what turns "the
      # collector ran" into evidence: every retained payload must hash to its content-addressed name,
      # no payload may be orphaned, and every pin in data/captures/config.json is exercised by a
      # corruption self-test. Freshness is NOT gated here on purpose - a pull request cannot fix a
      # missed collector run; data-refresh.yml gates it after it collects.
      - name: Capture store integrity, drift pins and their mutation test
        run: |
          python3 scripts/pipeline/verify_captures.py --no-freshness
          python3 scripts/pipeline/verify_captures.py --self-test

      # Added by session arena-543cdcb0-x1 (additive only). Three registers this round created, each
      # rebuilt from its inputs and required to reproduce: the pre-registration register (which resolves
      # every rule's registration commit from git), the PR-01 shadow baseline (walk-forward score and the
      # immutable pre-kickoff record), and the review board of suggestions and open questions.
      - name: Pre-registration, shadow baseline and review-board registers reproduce
        run: |
          # No `git fetch --unshallow` here on purpose. Both the artefact and this check are produced in
          # a shallow checkout (actions/checkout default fetch-depth 1), and a register built one way must
          # be compared in the same conditions or the gate fails on the environment rather than on the
          # data. The anchor that needs full history is resolved by a human/full-clone run of
          # `python3 tools/build_preregistration.py`, and CI carries it forward instead of flattening it.
          python3 tools/build_preregistration.py --check
          python3 tools/build_shadow_baseline.py --check
          python3 tools/build_next_decisions.py --check

      # The 2026-11-16 official pack, re-derived and compared to what is committed: standings arithmetic,
      # league closure, three-page record cross-check, slate completeness (32 clubs exactly once), the
      # dated-delta closure and the Week 10 promotion accounting. Read-only by design (see --write).
      - name: The dated official pack still closes
        run: python3 tools/verify_2026_11_16.py --check

      # Added by session arena-9d8c298c-x1 (additive only). The 2026-11-17 official reads pack, the
      # PR-04 Week 11 escrow and the feed-closure measurement each rebuild from their inputs and have to
      # reproduce: the reads checks (slate completeness, the standings page's own identities, records
      # agreeing across two official pages, the 44-row injury spot-check against the retained capture),
      # the escrow's pre-kickoff ordering and its no-rewrite guard, and the closure numbers this round
      # published while leaving data/results untouched. None of the three touches the network.
      - name: The 2026-11-17 reads pack, the Week 11 escrow and the closure measurement reproduce
        run: |
          python3 tools/lab/build_reads.py --check
          python3 tools/lab/build_escrow.py --check
          python3 tools/lab/build_closure_measurement.py --check
      # Added by session arena/dc96bc33-x1 (round 5): the 2026-11-17 pack re-derived the same way —
      # five checks including the corpus reconciliation (137 + 13 finals = the 32 official standings
      # rows exactly) and the continuity delta against the 2026-11-16 pack.
      - name: The 2026-11-17 pack still closes
        run: python3 tools/verify_2026_11_17_dc96bc33.py --check

      # Added by session arena/dc96bc33-x1 (round 5) on the handoff of session arena-d3df5dc2-x1
      # (PR #72): every row of the brief-coverage register cites a path that exists and a legal status.
      - name: Brief-coverage register is structurally sound
        run: python3 tools/verify_brief_coverage.py

      # The 2026-11-17 Week 10 closure: 14 finals read from the official page, the standings baseline the
      # feed is reconciled against, the mirror cross-check, and the 150-game arithmetic that must reproduce
      # W-L-T/PF/PA for all 32 clubs. `--check` also fails if the committed pack stops matching a fresh
      # build of the same reads, so the closure cannot drift from its evidence.
      # Path note (round-6 integration): two sessions shipped different tools at
      # tools/verify_2026_11_17_473e08d5.py — arena-473e08d5-x1's closure pack (via PR #84) and
      # arena/6a4ba536-x1's read cross-compare (via PR #88). The cross-compare keeps the shared
      # path main's CI already runs; the closure pack is re-homed, unchanged, under _closure_.
      - name: The Week 10 closure still reconciles
        run: python3 tools/verify_2026_11_17_closure_473e08d5.py --check

      - name: The canonical 2026-11-17 pack still closes
        run: python3 tools/verify_2026_11_17.py --check

      # Added by session arena/6a4ba536-x1 (round 6, additive only). Two sessions read the same
      # 2026-11-17 official pages minutes apart and merged into the same paths; main's transcription
      # keeps the canonical name and the other keeps its own bytes under a suffix. This gates that the
      # two INDEPENDENT reads still agree cell for cell (384 standings cells + 98 Week 10 cells), so a
      # divergence - one of the two being wrong - stops the build instead of shipping quietly.
      - name: The two independent 2026-11-17 transcriptions still agree
        run: python3 tools/verify_2026_11_17_473e08d5.py

      # Added by session arena/a02e9816-x1 (round 6): the 2026-11-18 official re-verification pack —
      # a fresh same-day read of the league standings page and the Week 10 slate, 5 checks (A1-A5)
      # including the 384-cell continuity agreement with the two independent 2026-11-17 reads and the
      # closed 150-row feed. `--check` fails if the committed pack stops matching a fresh build.
      - name: The 2026-11-18 re-verification pack still closes
        run: python3 tools/verify_2026_11_18.py --check

      # The appends into the three transcription inputs are derived from that pack, not typed into it:
      # re-running the promotion tool must be a no-op. This is the guard against a hand edit to
      # reads.tsv or a week PSV that no longer matches the official read it came from.
      - name: The promoted rows still derive from the dated pack
        run: python3 tools/promote_week10_2026_11_17.py --check

      # Added by session arena/5433abad-x1 (additive only). Brief row 24: one official Game Centre
      # venue per Week 10 fixture, each row linked to nfl.com/games and checked against the schedule file.
      - name: Week 10 official venue register (brief row 24)
        run: python3 tools/verify_venues_w10.py
      - name: Week 10 venue page is current (brief row 24)
        run: python3 tools/build_venues_page.py --check

      # Added by session arena/46887500-x1 (round 7, additive only). Depth-slot group model,
      # Packers jersey stripping, 32-club deficiency, W11 Offense vs Defense matrix, and
      # chronological splits / opponent-aware SRS / dual walk-forward totals / personnel ablations.
      - name: Verify depth-slot groups, 32-club deficiency and W11 matchup matrix
        run: |
          python3 tools/build_depth_matrix.py --check
          python3 tools/verify_depth_matrix.py
      - name: Verify chronological splits, opponent-aware SRS, dual totals and ablations
        run: |
          python3 tools/build_modeling_lab.py --check
          python3 tools/verify_modeling_lab.py
      - name: Replay the dated venue, report movement and strategy decision checks
        run: |
          python3 tools/official/gamecentre.py selftest
          python3 tools/verify_mind_change.py
          python3 tools/build_decision_review.py --check

      # Added by session arena/427c1843-x1 (round 7, additive only): the 2026-11-19 official
      # re-verification pack (A1-A8) — a same-day read of the league standings page, the Week 10
      # slate, the Week 11 slate and byes, the Week 11 injury report, and the three dated
      # announced-starter articles. Asserts the league closure (SW=SL=149, ties even, PF=PA, 150
      # games), the 482-cell continuity against the 2026-11-18 pack, and the shape of the injury
      # report. `--check` fails if the committed summary stops matching a fresh build.
      - name: The 2026-11-19 re-verification pack still closes
        run: python3 tools/verify_2026_11_19.py --check

      # Added by session arena/427c1843-x1 (round 7, additive only): the Decision Room is generated
      # from files in this repository, so a stale room is a room that disagrees with its own sources.
      - name: The Decision Room is current
        run: python3 tools/build_room.py --check

      # Added by session arena/48279a7d-x1 (additive only): Origination & Skill Desk
      # (vig-free decomposition, two-stage Brier skill leaderboard, official reserve/trades/inactives,
      # stadium NWS weather overlay, and 32-club weekly diff).
      - name: Origination and Skill Desk reproduces and passes unit checks
        run: |
          python3 tools/origination_desk/verify_desk.py
          python3 -m unittest tools/origination_desk/test_desk.py

