name: Publish static site to GitHub Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify internal links and source citations
        run: python3 scripts/verify_site.py
      - name: Verify dashboard links and sources
        run: python3 scripts/check_site.py
      - name: Verify the research lab (links, contracts, placeholders)
        run: python3 scripts/verify_research_site.py
      # Added by session arena/d577959f-x1 (additive only). Verifies the
      # live-pipeline section (live/*.html + data/pipeline/*.json) before it is
      # copied, so a broken section fails the build rather than shipping.
      - name: Verify the live-pipeline section
        run: python3 scripts/pipeline/verify_site.py
      # Added by session arena/459b17e1-x1 (additive only). Verifies the
      # second-opinion section (hub/*.html) before it is copied, so a broken
      # section fails the build rather than shipping.
      - name: Verify the second-opinion section
        run: python3 tools/hub/build_hub.py
      # Added by session arena/9cc1eaac-x1 (additive only): every published Week 10 cell is
      # diffed against an independent transcription of the official pages before the tree
      # is assembled, so a contradictory value fails the build rather than shipping.
      - name: Verify published data against the official pages
        run: python3 tools/verify_against_official.py
      # Added by session arena/fcc11e05-x1 (additive only). Verifies the unified
      # dashboard (app/**): links must resolve and every data row must carry a
      # source link or an explicit "no official source" marker.
      - name: Verify the unified dashboard
        run: python3 tools/verify_app.py
      # Added by session arena/56769365-x1 (additive only). The line desk: links resolve,
      # every data row is sourced or explicitly marked, no leaked template values.
      - name: Verify the line desk
        run: python3 tools/lab/build_site.py
      # Added by session arena/56769365-x1 (additive only). The verifiers above audit the
      # repository; this one audits the tree that is actually uploaded. It replays the copy
      # and sed steps below into a temp dir and crawls the result. Found two real defects
      # that no repository-level check could see (a missing src= rewrite and a folder that
      # was linked but never copied).
      - name: Crawl the assembled tree for broken links
        run: python3 tools/verify_deployed_tree.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble the served tree (site only, no sources or archive)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r pages assets _site/
          # the parallel session's data dashboard (real backtests + 2026 CSVs)
          cp -r dashboard _site/
          # the research session's model / strategy / prop / injury lab
          cp -r research _site/
          # snapshot annex from session arena/a78e0158-x1 (originated lines, backtests, correlations)
          cp -r site _site/
          # Added by session arena/d577959f-x1: the live official-source pipeline
          # section (auto-refreshed standings, injuries, depth charts, deficiency,
          # correlations). Additive; nothing above is modified or removed.
          cp -r live _site/
          # Added by session arena/459b17e1-x1: the second-opinion section
          # (section index, verification ledger, findings, deficiency board,
          # suggestion review board). Additive; nothing above is modified.
          cp -r hub _site/
          # Added by session arena/fcc11e05-x1: the unified dashboard. Additive —
          # every tree above is still copied and still reachable. The site root
          # serves the unified landing page: it is the same file as
          # app/index.html with same-folder links repointed into app/, so the two
          # cannot drift apart and there is no redirect. The previous root landing
          # page is preserved at /legacy-fourth-down.html rather than deleted.
          cp -r app _site/
          # Added by session arena/56769365-x1: the line desk (price snapshots, verified
          # results, originated lines, signal-vs-staking leaderboard, demotion gate).
          # Additive; every tree above is still copied and still reachable.
          cp -r lab _site/
          # Added by session arena/56769365-x1: hub/index.html links ../archive/previous-site/
          # to a committed 96 KB archive that was never copied, so that link has been dead on
          # the published site. Found by tools/verify_deployed_tree.py, which assembles the
          # upload tree instead of auditing the repository. Additive: one copy line.
          cp -r archive _site/
          cp index.html _site/legacy-fourth-down.html
          cp app/index.html _site/index.html
          # src="assets/ is rewritten too: the served root is app/index.html, which loads
          # <script src="assets/app.js">. Without this the script 404s at /assets/app.js
          # and the root page’s table filter and column sort silently do nothing.
          sed -i -E 's#href="assets/#href="app/assets/#g; s#src="assets/#src="app/assets/#g; s#href="([a-z0-9_-]+\.html)#href="app/\1#g; s#href="\.\./#href="./#g' _site/index.html
          mkdir -p _site/data
          cp data/*.json _site/data/ 2>/dev/null || true
          cp data/*.csv _site/data/ 2>/dev/null || true
          mkdir -p _site/data/processed
          cp data/processed/*.csv _site/data/processed/ 2>/dev/null || true
          cp data/raw_manifest.json _site/data/ 2>/dev/null || true
          mkdir -p _site/data/pipeline
          cp data/pipeline/*.json _site/data/pipeline/ 2>/dev/null || true
          # .nojekyll keeps files starting with _ and avoids any Jekyll processing
          touch _site/.nojekyll
          du -sh _site

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
