name: Publish static site to GitHub Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify internal links and source citations
        run: python3 scripts/verify_site.py
      - name: Verify dashboard links and sources
        run: python3 scripts/check_site.py
      - name: Verify the research lab (links, contracts, placeholders)
        run: python3 scripts/verify_research_site.py
      # Added by session arena/d577959f-x1 (additive only). Verifies the
      # live-pipeline section (live/*.html + data/pipeline/*.json) before it is
      # copied, so a broken section fails the build rather than shipping.
      - name: Verify the live-pipeline section
        run: python3 scripts/pipeline/verify_site.py
      # Added by session arena/459b17e1-x1 (additive only). Verifies the
      # second-opinion section (hub/*.html) before it is copied, so a broken
      # section fails the build rather than shipping.
      - name: Verify the second-opinion section
        run: python3 tools/hub/build_hub.py
      # Added by session arena/9cc1eaac-x1 (additive only): every published Week 10 cell is
      # diffed against an independent transcription of the official pages before the tree
      # is assembled, so a contradictory value fails the build rather than shipping.
      - name: Verify published data against the official pages
        run: python3 tools/verify_against_official.py
      # Added by session arena/fcc11e05-x1 (additive only). Verifies the unified
      # dashboard (app/**): links must resolve and every data row must carry a
      # source link or an explicit "no official source" marker.
      - name: Verify the unified dashboard
        run: python3 tools/verify_app.py
      # Added by session arena/fb9e0427-x1 (round 4, additive only). The landing page's decision-readiness
      # table is rendered from data/audit/readiness.json; the deploy fails if that register is stale.
      - name: Verify the decision-readiness register before deploy
        run: python3 tools/build_state_audit.py --check
      # Added by session arena/600e6009-x1 (round 3, additive only): the deploy gate
      # rebuilds the results feed, snapshot store, origination order and round-3
      # registers and fails if any invariant or freshness check breaks — a broken
      # feed never ships.
      - name: Verify round-3 feeds before deploy
        run: |
          python3 tools/build_results_r3.py --check
          python3 tools/build_snapshots.py --check
          python3 tools/build_origination.py --check
          python3 tools/build_round3.py --check
      # Added by session arena/56769365-x1 (additive only). The line desk: links resolve,
      # every data row is sourced or explicitly marked, no leaked template values.
      - name: Verify the line desk
        run: python3 tools/lab/build_site.py
      # Added by session arena/56769365-x1 (additive only). The verifiers above audit the
      # repository; this one audits the tree that is actually uploaded. It replays the copy
      # and sed steps below into a temp dir and crawls the result. Found two real defects
      # that no repository-level check could see (a missing src= rewrite and a folder that
      # was linked but never copied).
      - name: Crawl the assembled tree for broken links
        run: python3 tools/verify_deployed_tree.py
      # Added by session arena/bf27a3bd-x1 (additive only). Verifies the new
      # data stores (price snapshots, origination ledger, verified results feed,
      # leaderboard split, replacement depth, official correlations, demotion
      # gate) line by line: every row sourced or explicitly flagged, blanks
      # flagged never silent, results re-checked against the official
      # transcriptions, difference = model - market recomputed.
      - name: Verify the new data stores
        run: python3 tools/verify_new_data.py
      # Added by session arena/5f1c014c-x1 (additive only). Rebuilds the line
      # console from source and verifies it before the tree is assembled: a
      # broken or unsourced page fails the build rather than shipping.
      - name: Rebuild and verify the line console
        run: |
          set -euo pipefail
          python3 tools/build_console.py
          python3 tools/verify_console.py
      # Added by session arena/b03ced7c-x1 (additive only). The Week 10 official
      # re-capture, the depth-parse measurement, the readiness table and the flags
      # register are rebuilt from their inputs; then every published number is
      # re-derived and compared. A re-capture that drifts from its transcription, a
      # depth row silently cleaned, or a readiness row without a source fails here
      # rather than shipping.
      - name: Rebuild the Week 10 re-capture, depth parse and readiness table
        run: |
          set -euo pipefail
          python3 tools/official/week10_reconcile.py
          python3 tools/official/depth_parse.py
          python3 tools/official/readiness.py

      - name: Fail if the re-capture, depth parse or readiness files are stale
        run: |
          git diff --exit-code -- data/console/week10_reconcile.json data/console/week10_reconcile.csv data/console/depth_parse.json data/console/depth_parse.csv data/console/readiness.json data/console/readiness.csv

      - name: Verify every published number against the fresh capture
        run: python3 tools/official/verify_published.py
      # Added by session arena-55c364b6-x1 (round 6, additive only). The injury-report delta
      # series, the fixture-context feature set and the 2026-11-18 dated official reads are
      # rebuilt from the retained capture payloads and the retained read files, then compared
      # cell for cell. A payload that no longer reproduces its published hash, a store that has
      # drifted from its builder, a nav count that lies about a register, or a published injury
      # cell that disagrees with the page it came from each fail the build here.
      - name: Rebuild the availability series, the fixture-context store and the 2026-11-18 pack
        run: |
          set -euo pipefail
          python3 tools/build_2026_11_18_manifest.py --check
          python3 tools/build_availability_series.py --check
          python3 tools/build_fixture_context.py --check
      - name: Verify the round-6 stores line by line
        run: |
          set -euo pipefail
          python3 tools/verify_availability_series.py
          python3 tools/verify_2026_11_18_55c364b6.py

      # Added by session arena-55c364b6-x1 (round 6, additive only). The two-sided mind-change
      # register (brief row 18) is a view over the two published strategy tables, recomputed per
      # build: the adopt/abandon verdicts, the sample that would settle each undecided entry, and
      # the hash of the rule that freezes the method. A rule file edited after the results are in,
      # an entry missing a side, an orphan row matching no published strategy, or a register that
      # no longer reproduces from its inputs each fail the build here.
      - name: Rebuild and verify the two-sided mind-change register
        run: |
          set -euo pipefail
          python3 tools/build_mind_change.py --check
          python3 tools/verify_mind_change.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble the served tree (site only, no sources or archive)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r pages assets _site/
          # the parallel session's data dashboard (real backtests + 2026 CSVs)
          cp -r dashboard _site/
          # the research session's model / strategy / prop / injury lab
          cp -r research _site/
          # snapshot annex from session arena/a78e0158-x1 (originated lines, backtests, correlations)
          cp -r site _site/
          # Added by session arena/d577959f-x1: the live official-source pipeline
          # section (auto-refreshed standings, injuries, depth charts, deficiency,
          # correlations). Additive; nothing above is modified or removed.
          cp -r live _site/
          # Added by session arena/459b17e1-x1: the second-opinion section
          # (section index, verification ledger, findings, deficiency board,
          # suggestion review board). Additive; nothing above is modified.
          cp -r hub _site/
          # Added by session arena/fcc11e05-x1: the unified dashboard. Additive —
          # every tree above is still copied and still reachable. The site root
          # serves the unified landing page: it is the same file as
          # app/index.html with same-folder links repointed into app/, so the two
          # cannot drift apart and there is no redirect. The previous root landing
          # page is preserved at /legacy-fourth-down.html rather than deleted.
          cp -r app _site/
          # Added by session arena/56769365-x1: the line desk (price snapshots, verified
          # results, originated lines, signal-vs-staking leaderboard, demotion gate).
          # Additive; every tree above is still copied and still reachable.
          cp -r lab _site/
          # Added by session arena/56769365-x1: hub/index.html links ../archive/previous-site/
          # to a committed 96 KB archive that was never copied, so that link has been dead on
          # the published site. Found by tools/verify_deployed_tree.py, which assembles the
          # upload tree instead of auditing the repository. Additive: one copy line.
          cp -r archive _site/
          cp index.html _site/legacy-fourth-down.html
          # Added by session arena/5f1c014c-x1: the line console (line origination,
          # price store, strategy competition, decision register). Additive.
          cp -r console _site/
          mkdir -p _site/data/console
          cp data/console/*.csv data/console/*.json _site/data/console/ 2>/dev/null || true
          # Added by session arena-55c364b6-x1 (round 6, additive only): the two new stores and the
          # dated read pack behind the Injury report series and Fixture context pages. Without these
          # copy lines the pages link downloads that exist in the repository but not in the served
          # tree - exactly the defect tools/verify_deployed_tree.py was written to catch (it found
          # the same class of break in session arena/56769365-x1's hub tree).
          cp -r data/availability_series _site/data/availability_series
          cp -r data/fixtures _site/data/fixtures
          cp -r data/mind_change _site/data/mind_change
          mkdir -p _site/data/verification/2026_11_18
          cp data/verification/2026_11_18/*.tsv _site/data/verification/2026_11_18/ 2>/dev/null || true
          cp data/verification/2026_11_18/*.json _site/data/verification/2026_11_18/ 2>/dev/null || true
          # Landing page, resolved once. Two sessions claimed the root; the console
          # is served because it covers every requirement and links out to every
          # tree. app/ stays reachable at /app/ and is one click away.
          # Both href= and src= are rewritten: the root page loads
          # <script src="assets/console.js">, which 404s as /assets/console.js
          # unless the src is repointed too. The same defect on the app/ root was
          # found by tools/verify_deployed_tree.py in session arena/56769365-x1.
          cp console/index.html _site/index.html
          sed -i -E 's#href="assets/#href="console/assets/#g; s#src="assets/#src="console/assets/#g; s#href="([a-z0-9_-]+\.html)#href="console/\1#g; s#href="\.\./#href="./#g' _site/index.html
          mkdir -p _site/data
          cp data/*.json _site/data/ 2>/dev/null || true
          cp data/*.csv _site/data/ 2>/dev/null || true
          mkdir -p _site/data/processed
          cp data/processed/*.csv _site/data/processed/ 2>/dev/null || true
          cp data/raw_manifest.json _site/data/ 2>/dev/null || true
          mkdir -p _site/data/pipeline
          cp data/pipeline/*.json _site/data/pipeline/ 2>/dev/null || true
          # Added by session arena/3fa49c1a-x1: round-N stores (verified results
          # feed, price snapshots, replacement depth, official correlations,
          # originated markets, decision registers). Additive only — nothing
          # above is modified or removed.
          cp -r data/results _site/data/results
          # Added by session arena-2f95e652-x1: the 2026-11-17 evidence pack (the dated official
          # read behind console/evidence-2026-11-17.html). Additive only.
          mkdir -p _site/data/evidence/2026_11_17
          cp data/evidence/2026_11_17/*.tsv data/evidence/2026_11_17/*.csv \
             data/evidence/2026_11_17/summary.json _site/data/evidence/2026_11_17/
          cp -r data/prices _site/data/prices
          cp -r data/depth _site/data/depth
          cp -r data/correlations _site/data/correlations
          cp -r data/origin _site/data/origin
          mkdir -p _site/data/lines
          cp data/lines/originated_markets_2026_week10.csv _site/data/lines/
          # Added by session arena/5433abad-x1 (additive only): brief row 24 venue register page + its CSV.
          cp -r venues _site/
          mkdir -p _site/data/nfl
          cp data/nfl/venues_2026_week10.csv _site/data/nfl/
          # .nojekyll keeps files starting with _ and avoids any Jekyll processing
          touch _site/.nojekyll
          du -sh _site

      - name: Verify round-2 stores are published (Added by session arena/907c5baf-x1)
        run: |
          test -f _site/data/results_feed.json
          test -f _site/data/price_snapshots.json
          test -f _site/data/leaderboard_split.json
          test -f _site/data/demotion_gate.json
          test -f _site/app/results.html
          test -f _site/app/prices.html
          python3 tools/verify_stores.py

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
