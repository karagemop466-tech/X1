name: probe-raw-formats
on:
  push:
    branches: ["arena/0c2fcfa1-x1"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Analyze official schedule structure
        shell: bash
        run: |
          set +e
          mkdir -p data/nfl/_debug
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          curl -sS -A "$UA" -L --max-time 120 \
            "https://www.nfl.com/schedules/2026/by-week/week-10" -o /tmp/sched.html
          curl -sS -A "$UA" -L --max-time 120 \
            "https://www.nfl.com/schedules/2026/by-week/week-3" -o /tmp/sched3.html
          curl -sS -A "$UA" -L --max-time 120 \
            "https://www.nfl.com/scores/" -o /tmp/scores.html

          python3 - <<'PY' > data/nfl/_debug/schedule_analysis.txt 2>&1
          import re, json

          h = open("/tmp/sched.html", encoding="utf-8", errors="replace").read()

          print("=== DmaCodes context (schedule page) ===")
          i = h.find("DmaCodes")
          print(repr(h[max(0,i-1200):i+200]))

          print()
          print("=== JSON objects containing DmaCodes ===")
          # any object with DmaCodes
          for m in list(re.finditer(r"DmaCodes", h))[:2]:
              start = h.rfind("{", max(0, m.start()-2000), m.start())
              print(repr(h[start:m.start()+300])[:1500])
              print("---")

          print()
          print("=== rendered row around a /games/ anchor ===")
          m = re.search(r'href="(/games/commanders-at-giants-2026-reg-10)"', h)
          if m:
              seg = h[max(0,m.start()-4000):m.start()+4000]
              text = re.sub(r"<[^>]+>", " ", seg)
              text = re.sub(r"\s+", " ", text)
              print(text[:2000])

          print()
          print("=== unique /games/ anchors for week 3 ===")
          h3 = open("/tmp/sched3.html", encoding="utf-8", errors="replace").read()
          for a in sorted(set(re.findall(r'href="(/games/[^"]+)"', h3))):
              print("   ", a)

          print()
          print("=== scores page: does it carry final scores in markup? ===")
          hs = open("/tmp/scores.html", encoding="utf-8", errors="replace").read()
          for marker in ("Final", "FINAL", "Hidden Score", "data-testid=\"game-status\""):
              print(f"  {marker}: {hs.count(marker)}")
          m = re.search(r'href="(/games/commanders-at-giants-2026-reg-10)"', hs)
          if m:
              seg = hs[max(0,m.start()-6000):m.start()+6000]
              text = re.sub(r"<[^>]+>", " ", seg)
              text = re.sub(r"\s+", " ", text)
              print("  TEXT:", text[:1200])
          print()
          print("=== standings nationalGames: all objects, deduped ===")
          st = open("/tmp/stand.html", encoding="utf-8", errors="replace").read() if False else None
          PY
          cat data/nfl/_debug/schedule_analysis.txt
          exit 0
      - name: Commit analysis to scratch branch
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/raw-samples
          git add -f data/nfl/_debug
          git diff --staged --quiet || git commit -m "ci: analyze official schedule page structure"
          git push --force origin ci/raw-samples
          echo "push_exit=$?"
          exit 0
