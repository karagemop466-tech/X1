name: probe-raw-formats
on:
  push:
    branches: ["arena/0c2fcfa1-x1"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install PDF tooling
        run: pip install --quiet --disable-pip-version-check pypdf
      - name: Capture raw source formats
        shell: bash
        run: |
          set +e
          mkdir -p data/nfl/_debug
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          grab () { curl -sS -A "$UA" -L --max-time 120 "$2" -o "data/nfl/_debug/$1"; }

          grab schedule_full.html      "https://www.nfl.com/schedules/2026/by-week/week-10"
          grab schedule_full2.html     "https://www.nfl.com/schedules/2026/by-week/week-1"
          grab playerstats_full.html   "https://www.nfl.com/stats/player-stats/category/passing/2026/reg/all/passingyards/desc"
          grab playerstats_rush.html   "https://www.nfl.com/stats/player-stats/category/rushing/2026/reg/all/rushingyards/desc"
          grab playerstats_recv.html   "https://www.nfl.com/stats/player-stats/category/receiving/2026/reg/all/receivingreceptions/desc"
          grab team_stats.html         "https://www.nfl.com/teams/buffalo-bills/stats"
          grab roster_bills.html       "https://www.nfl.com/teams/buffalo-bills/roster/"

          # Probe for a paginated / all-rows variant of player stats.
          for u in \
            "https://www.nfl.com/stats/player-stats/category/passing/2026/reg/all/passingyards/desc?limit=500" \
            "https://www.nfl.com/stats/player-stats/category/passing/2026/reg/all/passingyards/desc?page=2" \
            ; do
            echo "=== $u"
            curl -sS -A "$UA" -L --max-time 60 "$u" -o /tmp/x.html
            python3 - <<'PY'
import re
h=open('/tmp/x.html',encoding='utf-8',errors='replace').read()
rows=re.findall(r'<tr[^>]*>', h)
print("bytes",len(h),"trs",len(rows))
PY
          done

          for f in data/nfl/_debug/*; do echo "$(wc -c < "$f") $f"; done
          exit 0
      - name: Commit raw samples to scratch branch
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/raw-samples
          git add -f data/nfl/_debug
          git diff --staged --quiet || git commit -m "ci: capture full raw official source formats"
          git push --force origin ci/raw-samples
          echo "push_exit=$?"
          exit 0
