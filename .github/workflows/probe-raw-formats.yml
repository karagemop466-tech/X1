name: probe-raw-formats
on:
  push:
    branches: ["arena/0c2fcfa1-x1"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Inspect game center pages
        shell: bash
        run: |
          set +e
          mkdir -p data/nfl/_debug
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          for slug in \
            "falcons-at-panthers-2026-reg-18" \
            "bears-at-vikings-2026-reg-18" \
            "commanders-at-giants-2026-reg-10" \
            "patriots-at-lions-2026-reg-10" \
            ; do
            curl -sS -A "$UA" -L --max-time 90 -w "\nFINAL_URL=%{url_effective} CODE=%{http_code}\n" \
              "https://www.nfl.com/games/$slug" -o "/tmp/gc_$slug.html"
            echo "--- $slug"
            tail -1 "/tmp/gc_$slug.html" >/dev/null
            python3 - "$slug" >> data/nfl/_debug/game_center_probe.txt <<'PY'
import re, sys
slug = sys.argv[1]
h = open(f"/tmp/gc_{slug}.html", encoding="utf-8", errors="replace").read()
print("bytes", len(h))
m = re.search(r"<title>(.*?)</title>", h, re.S)
print("title:", (m.group(1).strip()[:90] if m else None))
keys = re.findall(r'data-key="([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"', h)
print("data-key ids:", len(keys), "first 3:", keys[:3])
cur = re.findall(r'data-key="([0-9a-f\-]{36})"[^>]*>\s*<a[^>]*aria-current="page"', h)
print("aria-current matches:", len(cur), cur[:3])
pdfs = re.findall(r'https://static\.www\.nfl\.com/[^"\'\s]*?/gamecenter/([0-9a-f\-]+)\.pdf', h)
print("pdf ids:", len(pdfs), "unique:", sorted(set(pdfs))[:4])
print("canonical:", re.findall(r'<link rel="canonical" href="([^"]+)"', h)[:1])
PY
            done
          exit 0
      - name: Commit analysis to scratch branch
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/raw-samples
          git add -f data/nfl/_debug
          git diff --staged --quiet || git commit -m "ci: inspect game center pages"
          git push --force origin ci/raw-samples
          echo "push_exit=$?"
          exit 0
