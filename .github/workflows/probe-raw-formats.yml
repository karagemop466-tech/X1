name: probe-raw-formats
on:
  push:
    branches: ["arena/0c2fcfa1-x1"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Extract game structure
        shell: bash
        run: |
          set +e
          mkdir -p data/nfl/_debug
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          curl -sS -A "$UA" -L --max-time 120 \
            "https://www.nfl.com/schedules/2026/by-week/week-3" -o /tmp/sched3.html
          curl -sS -A "$UA" -L --max-time 120 \
            "https://www.nfl.com/scores/" -o /tmp/scores.html

          python3 - <<'PY' > data/nfl/_debug/game_shape.txt 2>&1
          import re, json

          raw = open("/tmp/sched3.html", encoding="utf-8", errors="replace").read()

          # The payload is a JSON document embedded in a JS string: quotes are
          # backslash-escaped. Normalise the escapes so the JSON parses.
          unesc = raw.replace("\\\\", "\\").replace('\\"', '"')
          print("raw bytes", len(raw))

          # Find self-contained objects carrying gameId and week.
          found = 0
          for m in re.finditer(r'"gameId":"([0-9a-f\-]{36})"', unesc):
              start = unesc.rfind("{", 0, m.start())
              depth = 0
              end = -1
              for j in range(start, len(unesc)):
                  ch = unesc[j]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = j + 1
                          break
              if end < 0 or end - start > 8000:
                  continue
              try:
                  obj = json.loads(unesc[start:end])
              except ValueError:
                  continue
              if not isinstance(obj, dict) or "week" not in obj:
                  continue
              found += 1
              if found == 1:
                  print("=== GAME OBJECT KEYS ===")
                  print(sorted(obj.keys()))
                  print("=== SAMPLE ===")
                  print(json.dumps(obj, indent=1)[:3000])
          print("game objects with week:", found)

          # Fallback: what keys appear near a gameId at all?
          near = re.findall(r'"([a-zA-Z]{3,30})":', unesc[max(0, m.start()-1500):m.start()+1500])
          from collections import Counter
          print("nearby keys:", [k for k, _ in Counter(near).most_common(40)])

          print()
          print("=== SCORES PAGE: completed game text ===")
          hs = open("/tmp/scores.html", encoding="utf-8", errors="replace").read()
          # Look for a game with a numeric score near its anchor
          for m in list(re.finditer(r'href="(/games/[^"?]+)"', hs))[:40]:
              seg = hs[max(0, m.start()-3000):m.start()+3000]
              txt = re.sub(r"<[^>]+>", " ", seg)
              txt = re.sub(r"\s+", " ", txt)
              if re.search(r"\b\d{1,3}\s*-\s*\d{1,3}\b", txt):
                  print("ANCHOR:", m.group(1))
                  print("  TEXT:", txt[:700])
                  break
          print("date-ish tokens on schedule page:")
          for pat in (r'"date"\s*:', r'"gameDate"', r'"gameDateTime"', r'"shortDate"'):
              print(f"   {pat}: {unesc.count(pat)}")
          for m in list(re.finditer(r'"(gameDate|gameDateTime|shortDate|date)"\s*:\s*"([^"]{4,40})"', unesc))[:8]:
              print("   ", m.group(1), "=", m.group(2))
          PY
          cat data/nfl/_debug/game_shape.txt
          exit 0
      - name: Commit analysis to scratch branch
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/raw-samples
          git add -f data/nfl/_debug
          git diff --staged --quiet || git commit -m "ci: extract game object shape from official schedule payload"
          git push --force origin ci/raw-samples
          echo "push_exit=$?"
          exit 0
