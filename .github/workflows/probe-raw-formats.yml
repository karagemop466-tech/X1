name: probe-raw-formats
on:
  push:
    branches: ["arena/0c2fcfa1-x1"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Analyze official schedule structure
        shell: bash
        run: |
          set +e
          mkdir -p data/nfl/_debug
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          curl -sS -A "$UA" -L --max-time 120 \
            "https://www.nfl.com/schedules/2026/by-week/week-10" -o /tmp/sched.html
          curl -sS -A "$UA" -L --max-time 120 \
            "https://www.nfl.com/standings/league/2026/REG" -o /tmp/stand.html
          curl -sS -A "$UA" -L --max-time 120 \
            "https://www.nfl.com/scores/" -o /tmp/scores.html

          python3 - <<'PY' > data/nfl/_debug/schedule_analysis.txt 2>&1
          import re, json

          for name in ("sched", "stand", "scores"):
              h = open(f"/tmp/{name}.html", encoding="utf-8", errors="replace").read()
              print(f"===== {name} bytes={len(h)}")
              anchors = re.findall(r'href="(/games/[^"]+)"', h)
              uniq = sorted(set(anchors))
              print(f"  /games/ anchors: {len(anchors)} unique={len(uniq)}")
              for a in uniq:
                  print(f"    {a}")
              # JSON game object shape
              objs = re.findall(
                  r'\{"Description":"([^"]*)","Title":"([^"]*)","StartTime":"([^"]*)",'
                  r'"EndTime":"([^"]*)","GameTerritory":"([^"]*)","GameId":"([^"]*)",'
                  r'"Week":"([^"]*)"', h)
              print(f"  json game objects: {len(objs)}")
              ids = sorted(set(o[5] for o in objs))
              print(f"  unique game ids: {len(ids)}")
              for o in objs[:4]:
                  print(f"    {o[1]} | {o[2]} | id={o[5]} | week={o[6]}")
              # any other embedded arrays mentioning GameId
              print(f"  'GameId' occurrences: {h.count('GameId')}")
              print(f"  'DmaCodes' occurrences: {h.count('DmaCodes')}")
              for marker in ("nationalGames=[", "Games=[", "gamedata", "__NEXT_DATA__", "window.__NUXT__"):
                  print(f"  marker {marker!r}: {h.count(marker)}")
              print()
          PY
          cat data/nfl/_debug/schedule_analysis.txt
          exit 0
      - name: Commit analysis to scratch branch
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/raw-samples
          git add -f data/nfl/_debug
          git diff --staged --quiet || git commit -m "ci: analyze official schedule page structure"
          git push --force origin ci/raw-samples
          echo "push_exit=$?"
          exit 0
