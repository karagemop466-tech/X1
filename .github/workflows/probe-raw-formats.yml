name: probe-raw-formats
on:
  push:
    branches: ["arena/0c2fcfa1-x1"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Extract game object shape
        shell: bash
        run: |
          set +e
          mkdir -p data/nfl/_debug
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          curl -sS -A "$UA" -L --max-time 120 \
            "https://www.nfl.com/schedules/2026/by-week/week-3" -o /tmp/sched3.html

          python3 - <<'PY' > data/nfl/_debug/game_shape.txt 2>&1
          import re, json, html

          raw = open("/tmp/sched3.html", encoding="utf-8", errors="replace").read()
          # The payload is HTML-escaped inside a script tag.
          unesc = html.unescape(raw)
          print("unescaped bytes:", len(unesc))

          # Find the script that holds the schedule payload.
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", unesc, re.S)
          print("scripts:", len(scripts))

          best = None
          for s in scripts:
              if '"gameId"' in s and '"week"' in s:
                  if best is None or len(s) > len(best):
                      best = s
          print("best script len:", len(best) if best else 0)

          if best:
              # Locate a self-contained object that carries gameId + week.
              for m in re.finditer(r'"gameId":"([0-9a-f\-]{36})"', best):
                  start = best.rfind("{", 0, m.start())
                  # walk forward to the matching close brace
                  depth = 0
                  end = -1
                  for j in range(start, len(best)):
                      if best[j] == "{":
                          depth += 1
                      elif best[j] == "}":
                          depth -= 1
                          if depth == 0:
                              end = j + 1
                              break
                  if end < 0 or end - start > 6000:
                      continue
                  try:
                      obj = json.loads(best[start:end])
                  except ValueError:
                      continue
                  if isinstance(obj, dict) and "week" in obj and "gameId" in obj:
                      print("=== GAME OBJECT KEYS ===")
                      print(sorted(obj.keys()))
                      print("=== SAMPLE ===")
                      print(json.dumps(obj, indent=1)[:2500])
                      break
          # Count distinct game ids that mention week
          ids = set(re.findall(r'"gameId":"([0-9a-f\-]{36})"', best or ""))
          print("distinct game ids in payload:", len(ids))
          weeks = re.findall(r'"week":(\d+)', best or "")
          from collections import Counter
          print("week value counts:", Counter(weeks).most_common(8))
          PY
          cat data/nfl/_debug/game_shape.txt
          exit 0
      - name: Commit analysis to scratch branch
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/raw-samples
          git add -f data/nfl/_debug
          git diff --staged --quiet || git commit -m "ci: extract game object shape from official schedule payload"
          git push --force origin ci/raw-samples
          echo "push_exit=$?"
          exit 0
