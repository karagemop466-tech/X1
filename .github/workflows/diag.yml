name: diag

# Temporary diagnostic workflow used to confirm that a GitHub-hosted runner can
# fetch and parse the official NFL pages with the Python standard library only.
# Safe to delete once the data pipeline is validated.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe official sources
        shell: bash
        run: |
          mkdir -p diag
          { python3 - <<'PY'
          import re, ssl, sys, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          ctx = ssl.create_default_context()

          URLS = [
              "https://www.nfl.com/standings/league/2026/REG",
              "https://www.nfl.com/injuries/",
              "https://www.nfl.com/stats/team-stats/defense/passing/2026/reg/all",
              "https://www.buffalobills.com/team/depth-chart",
          ]

          for url in URLS:
              print("=" * 70)
              print("URL:", url)
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": UA,
                      "Accept": "text/html,application/xhtml+xml",
                      "Accept-Language": "en-US,en;q=0.9",
                  })
                  with urllib.request.urlopen(req, timeout=45, context=ctx) as r:
                      raw = r.read()
                      status = r.status
                      final = r.geturl()
                  html = raw.decode("utf-8", "replace")
              except Exception as exc:  # noqa: BLE001
                  print("  FETCH ERROR:", type(exc).__name__, exc)
                  continue
              print("  status:", status, "final:", final, "bytes:", len(raw))
              print("  <table count:", html.count("<table"),
                    " <tr count:", len(re.findall(r"<tr", html, re.I)),
                    " <td count:", len(re.findall(r"<td", html, re.I)))
              print("  has __NEXT_DATA__:", "__NEXT_DATA__" in html,
                    " has __NUXT__:", "__NUXT__" in html)
              # Look for embedded JSON blobs that often carry the real data.
              for key in ("standings", "injuries", "depthChart", "depth_chart", "gameStatus"):
                  print(f"  contains '{key}':", key in html)
              snippet = re.sub(r"<[^>]+>", " ", html[:1200])
              print("  head-snippet:", re.sub(r"\s+", " ", snippet)[:300])
          PY
          } 2>&1 | tee diag/out.txt

      - name: Publish probe output
        shell: bash
        run: |
          git config user.name "x1-bot"
          git config user.email "x1-bot@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add diag/out.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "diag: probe output $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
