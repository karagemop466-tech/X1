# Immutable injury-report ledger (session arena-c0461519-x1).
#
# pull_request : PROBE. Captures the official NFL.com injury page into a scratch
#                directory on the runner, verifies the hash chain, and uploads the
#                result as an artifact. A failed fetch or a schema change fails the
#                check instead of passing silently.
# schedule     : CAPTURE. Appends one ledger line per read to data/ledger/injuries/,
#                stores raw bytes only when the page content changes, verifies the
#                whole chain, and commits. A fatal flag fails the run (the alarm).
name: injury-ledger

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours UTC: the report is read daily, Wed through kickoff
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/snapshot_ledger.py"
      - ".github/workflows/injury-ledger.yml"
      - "data/ledger/**"

permissions:
  contents: read

concurrency:
  group: injury-ledger
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture the official injury page into a scratch ledger
        run: python3 tools/snapshot_ledger.py capture --out "$RUNNER_TEMP/ledger"

      - name: Verify the scratch ledger (hash chain and raw bytes)
        run: python3 tools/snapshot_ledger.py verify --dir "$RUNNER_TEMP/ledger"

      - name: Keep the probe capture as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: injury-ledger-probe
          path: ${{ runner.temp }}/ledger
          if-no-files-found: warn

  capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture the official injury page
        id: capture
        continue-on-error: true
        run: python3 tools/snapshot_ledger.py capture --out data/ledger/injuries

      - name: Verify the whole ledger
        run: python3 tools/snapshot_ledger.py verify --dir data/ledger/injuries

      - name: Commit the new ledger lines (append-only)
        if: always()
        run: |
          set -e
          git config user.name "x1-bot"
          git config user.email "x1-bot@users.noreply.github.com"
          git add data/ledger/injuries
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "ledger: injury-report read $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed"; exit 0
            fi
            echo "push attempt ${attempt} failed; retrying"; sleep $((attempt * 5))
          done
          echo "could not push the ledger"; exit 1

      - name: Alarm — fail the run when the capture hit a fatal flag
        if: steps.capture.outcome == 'failure'
        run: |
          echo "::error::Injury-report capture failed or the page schema changed. The ledger line records the flags."
          exit 1
