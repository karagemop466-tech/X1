name: probe-nfl-egress
on:
  push:
    branches: ["arena/0c2fcfa1-x1"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Probe NFL endpoints
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          {
            for pair in \
              "injuries|https://www.nfl.com/injuries/" \
              "standings|https://www.nfl.com/standings/league/2026/REG" \
              "schedule|https://www.nfl.com/schedules/2026/by-week/week-10" \
              "player_stats|https://www.nfl.com/stats/player-stats/category/passing/2026/reg/all/passingyards/desc" \
              "gamebook|https://static.www.nfl.com/image/upload/v1794570519/gamecenter/ab5828d9-4feb-11f1-abca-2c54536568a9.pdf" \
              ; do
              name="${pair%%|*}"; url="${pair#*|}"
              code=$(curl -sS -A "$UA" -o "probe/$name.raw" -w "%{http_code}" --max-time 90 -L "$url" || echo "ERR")
              size=$(wc -c < "probe/$name.raw" 2>/dev/null || echo 0)
              echo "PROBE $name http=$code bytes=$size url=$url"
            done
            echo "--- markers ---"
            for f in probe/*.raw; do
              echo "== $f"
              case "$f" in
                *.pdf) head -c 16 "$f" | xxd | head -1 ;;
                *) grep -c -o -i "Game Status" "$f" 2>/dev/null | head -1
                   grep -o -i "Did Not Participate In Practice" "$f" 2>/dev/null | head -1
                   grep -o -i "<table" "$f" 2>/dev/null | head -1 ;;
              esac
            done
          } > probe/RESULTS.txt 2>&1
          cat probe/RESULTS.txt
      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/RESULTS.txt
          git diff --staged --quiet || git commit -m "ci: record NFL endpoint probe results"
          git push origin HEAD:${{ github.ref_name }}
