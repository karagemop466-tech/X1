name: probe-nfl-egress
on:
  push:
    branches: ["arena/0c2fcfa1-x1"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Probe NFL endpoints
        shell: bash
        run: |
          set +e
          mkdir -p probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          {
            for pair in \
              "injuries|https://www.nfl.com/injuries/" \
              "standings|https://www.nfl.com/standings/league/2026/REG" \
              "schedule|https://www.nfl.com/schedules/2026/by-week/week-10" \
              "player_stats|https://www.nfl.com/stats/player-stats/category/passing/2026/reg/all/passingyards/desc" \
              "gamebook|https://static.www.nfl.com/image/upload/v1794570519/gamecenter/ab5828d9-4feb-11f1-abca-2c54536568a9.pdf" \
              ; do
              name="${pair%%|*}"; url="${pair#*|}"
              code=$(curl -sS -A "$UA" -o "probe/$name.raw" -w "%{http_code}" --max-time 90 -L "$url" 2>/dev/null)
              [ -z "$code" ] && code="ERR"
              size=$(wc -c < "probe/$name.raw" 2>/dev/null) || size=0
              [ -z "$size" ] && size=0
              echo "PROBE $name http=$code bytes=$size url=$url"
            done
            echo "--- markers ---"
            for f in probe/*.raw; do
              echo "== $f"
              if [[ "$f" == *.pdf ]]; then
                head -c 8 "$f" | xxd | head -1
              else
                gs=$(grep -c -i "Game Status" "$f" 2>/dev/null); echo "  game_status_hits=$gs"
                dnp=$(grep -c -i "Did Not Participate" "$f" 2>/dev/null); echo "  dnp_hits=$dnp"
                tb=$(grep -c -i "<table" "$f" 2>/dev/null); echo "  table_tags=$tb"
                json=$(grep -c -o "__NEXT_DATA__\|window.__NUXT__" "$f" 2>/dev/null); echo "  framework_markers=$json"
              fi
            done
          } > probe/RESULTS.txt 2>&1
          cat probe/RESULTS.txt
          exit 0
      - name: Commit probe results
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe/RESULTS.txt
          git diff --staged --quiet || git commit -m "ci: record NFL endpoint probe results"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "push_exit=$?"
          exit 0
