name: data-refresh

# Collects every dataset from its official source with no manual input, commits
# the result, and rebuilds/publishes the GitHub Pages site.

on:
  schedule:
    # Injury reports move most on Wed/Thu/Fri and on game mornings.
    - cron: "17 11,15,19,23 * * *"   # every 6 hours (UTC)
    - cron: "42 12,16 * * 0,1,4"   # extra pass on game days (Sun/Mon/Thu)
  workflow_dispatch:
    inputs:
      skip_pages:
        description: "Skip the Pages rebuild"
        type: boolean
        default: false
  push:
    branches: ['**']
    paths:
      - 'pipeline/**'
      - '.github/workflows/data-refresh.yml'

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the official-source pipeline
        id: pipeline
        continue-on-error: true
        run: |
          mkdir -p data
          { python3 -m pipeline; echo "exit=$?"; } 2>&1 | tee data/_pipeline.log

      - name: Verify row-level source coverage
        continue-on-error: true
        run: python3 scripts/verify_data.py 2>&1 | tee data/_verify.log

      - name: Commit refreshed data
        if: always()
        run: |
          mkdir -p _ci
          {
            set -x
            git config user.name "x1-bot"
            git config user.email "x1-bot@users.noreply.github.com"
            # Adopt whatever the branch has moved on to (another session may have
            # pushed) without touching the working tree, then stage only data/.
            # --mixed avoids the rebase conflicts a pull can produce here, because
            # pull refuses to run with the dirty tree the pipeline leaves behind.
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add data
            if git diff --cached --quiet; then
              echo "MARKER: no data change"
            else
              git commit -m "data: refresh from official sources $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              pushed=0
              for attempt in 1 2 3 4 5; do
                git fetch origin "${GITHUB_REF_NAME}"
                if git rebase "origin/${GITHUB_REF_NAME}"; then
                  if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                    echo "MARKER: pushed on attempt ${attempt}"
                    pushed=1
                    break
                  fi
                else
                  git rebase --abort || true
                fi
                sleep $((attempt * 5))
              done
              [ "${pushed}" = "1" ] || echo "MARKER: PUSH FAILED after 5 attempts"
            fi
            echo "MARKER: done"
          } 2>&1 | tee _ci/commit.log
          grep -q "MARKER: done" _ci/commit.log

      - name: Publish CI log
        if: always()
        continue-on-error: true
        run: |
          git config user.name "x1-bot"
          git config user.email "x1-bot@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --mixed "origin/${GITHUB_REF_NAME}"
          git add _ci
          if git diff --cached --quiet; then echo "no ci log change"; exit 0; fi
          git commit -m "ci: publish run log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; sleep 5; continue; }
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done

      - name: Assemble the site
        if: ${{ github.event.inputs.skip_pages != 'true' }}
        run: |
          rm -rf site/data
          mkdir -p site/data
          cp data/*.json site/data/
          python3 scripts/verify_site.py

      - name: Build Pages artifact
        if: ${{ github.event.inputs.skip_pages != 'true' }}
        id: build
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event.inputs.skip_pages != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: ${{ github.event.inputs.skip_pages != 'true' }}
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
