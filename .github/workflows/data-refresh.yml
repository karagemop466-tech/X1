name: data-refresh

# Collects every dataset from its official source with no manual input, commits
# the result, and rebuilds/publishes the GitHub Pages site.

on:
  schedule:
    # Injury reports move most on Wed/Thu/Fri and on game mornings.
    - cron: "17 11,15,19,23 * * *"   # every 6 hours (UTC)
    - cron: "42 12,16 * * 0,1,4"   # extra pass on game days (Sun/Mon/Thu)
  workflow_dispatch:
    inputs:
      skip_pages:
        description: "Skip the Pages rebuild"
        type: boolean
        default: false
  push:
    branches: ['**']
    paths:
      - 'pipeline/**'
      - '.github/workflows/data-refresh.yml'

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the official-source pipeline
        id: pipeline
        continue-on-error: true
        run: |
          mkdir -p _ci
          { python3 -m pipeline; echo "exit=$?"; } 2>&1 | tee _ci/pipeline.log
          # Keep a copy inside data/ so the log is always committed, even when a
          # crash means there is no data change to commit.
          cp _ci/pipeline.log data/_pipeline_stamp.log
          date -u +%Y-%m-%dT%H:%M:%SZ >> data/_pipeline_stamp.log
          {
            echo "### data-refresh: pipeline output"
            echo '```'
            tail -60 _ci/pipeline.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify row-level source coverage
        continue-on-error: true
        run: python3 scripts/verify_data.py 2>&1 | tee data/_verify.log

      - name: Commit refreshed data
        if: always()
        run: |
          {
            set -x
            git config user.name "x1-bot"
            git config user.email "x1-bot@users.noreply.github.com"
            # Adopt whatever the branch has moved on to (another session may have
            # pushed) without touching the working tree, then stage data/ and the
            # run logs. --mixed avoids the rebase conflicts a pull produces when
            # the pipeline has left the tree dirty.
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add data _ci
            git status --porcelain
            if git diff --cached --quiet; then
              echo "MARKER: nothing to commit"
            else
              git commit -m "data: refresh from official sources $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              pushed=0
              for attempt in 1 2 3 4 5; do
                git fetch origin "${GITHUB_REF_NAME}"
                if git rebase "origin/${GITHUB_REF_NAME}"; then
                  if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                    echo "MARKER: pushed on attempt ${attempt}"
                    pushed=1
                    break
                  fi
                else
                  git rebase --abort || true
                fi
                sleep $((attempt * 5))
              done
              [ "${pushed}" = "1" ] || echo "MARKER: PUSH FAILED after 5 attempts"
            fi
            echo "MARKER: done"
          } 2>&1 | tee _ci/commit.log
          # The job summary is readable through the Checks API even when the
          # push fails, which is the only way to diagnose a rejected push.
          {
            echo "### data-refresh: commit step"
            echo '```'
            cat _ci/commit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q "MARKER: done" _ci/commit.log

      - name: Upload diagnostics via the API
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in commit pipeline; do
            file="_ci/${name}.log"
            [ -f "$file" ] || echo "(no ${name} log)" > "$file"
            b64=$(base64 -w0 "$file")
            sha=$(gh api "repos/${{ github.repository }}/contents/${file}?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${{ github.repository }}/contents/${file}" \
                -f message="ci: diagnostics ${name} $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -f content="$b64" -f branch="${GITHUB_REF_NAME}" -f sha="$sha" >/dev/null
            else
              gh api -X PUT "repos/${{ github.repository }}/contents/${file}" \
                -f message="ci: diagnostics ${name} $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -f content="$b64" -f branch="${GITHUB_REF_NAME}" >/dev/null
            fi
          done

      - name: Assemble the site
        if: ${{ github.event.inputs.skip_pages != 'true' }}
        run: |
          rm -rf site/data
          mkdir -p site/data
          cp data/*.json site/data/
          python3 scripts/verify_site.py

      - name: Build Pages artifact
        if: ${{ github.event.inputs.skip_pages != 'true' }}
        id: build
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event.inputs.skip_pages != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: ${{ github.event.inputs.skip_pages != 'true' }}
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
