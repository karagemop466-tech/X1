name: data-refresh

# Collects every dataset from its official source with no manual input, commits
# the result, and verifies the published site.
#
# GitHub Pages is configured with the legacy branch builder on /, so the
# published site is the repository root and Pages rebuilds itself whenever this
# job commits new data to the branch.

# Owned by session arena/d577959f-x1. Runs the automated official-source
# collector that feeds the "Live pipeline" section of the site (live/*.html,
# data/pipeline/*.json). Named so it cannot collide with the other sessions'
# pages.yml / pipeline.yml / verify.yml workflows.
on:
  schedule:
    # Injury reports move most on Wed/Thu/Fri and on game mornings.
    - cron: "17 11,15,19,23 * * *"   # every 6 hours (UTC)
    - cron: "42 12,16 * * 0,1,4"     # extra pass on game days (Sun/Mon/Thu)
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'pipeline/**'
      - 'scripts/pipeline/**'
      - '.github/workflows/data-refresh.yml'

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the official-source pipeline
        id: pipeline
        continue-on-error: true
        run: |
          mkdir -p /tmp/x1ci
          { python3 -m pipeline; echo "exit=$?"; } 2>&1 | tee /tmp/x1ci/pipeline.log

      - name: Verify row-level source coverage
        continue-on-error: true
        run: python3 scripts/pipeline/verify_data.py

      - name: Verify the published site
        run: python3 scripts/pipeline/verify_site.py

      # Added by session arena-543cdcb0-x1. Everything the collector read is retained as a dated,
      # hash-addressed capture BEFORE anything is committed, and the retention is gated: a read whose
      # shape does not match data/captures/config.json stops the derived tables from being published.
      # The captures themselves are always pushed - losing evidence because a report changed format is
      # how the site ended up with one capture for five game weeks.
      - name: Retain the reads, then gate the capture store
        if: always()
        run: |
          set -uo pipefail
          python3 -m pipeline.capture_store ingest
          python3 -m pipeline.capture_store status
          # The verdict is recorded with if/else, not `${PIPESTATUS[0]}`: the step's implicit `-e`
          # aborts it on the failing pipeline, so the echo after it never runs and the next step sees
          # the variable UNSET. That is how a run whose rebuild gate failed reported "derived artefacts
          # withheld (rebuild/verify gate = unset)" - true by accident, and it hid which gate said no.
          if python3 scripts/pipeline/verify_captures.py | tee /tmp/x1ci/captures.log; then
            echo "CAPTURE_GATE=0" >> "$GITHUB_ENV"
          else
            echo "CAPTURE_GATE=1" >> "$GITHUB_ENV"
          fi

      # A refreshed data/pipeline only lands if the artefacts derived from it land in the same commit:
      # verify.yml fails on staleness, so pushing data alone would turn main red. This rebuilds them and
      # runs the same verifiers CI runs, and the commit step honours the verdict.
      - name: Rebuild every artefact the refresh moves
        if: always()
        run: |
          set -uo pipefail
          if python3 tools/rebuild_for_refresh.py | tee /tmp/x1ci/rebuild.log; then
            echo "REBUILD_GATE=0" >> "$GITHUB_ENV"
          else
            echo "REBUILD_GATE=1" >> "$GITHUB_ENV"
          fi

      - name: Commit refreshed data
        if: always()
        run: |
          {
            set -x
            git config user.name "x1-bot"
            git config user.email "x1-bot@users.noreply.github.com"
            # The defect this replaced: `rm -rf _ci` deleted two TRACKED files (the workflow's own
            # diagnostics logs - the comment beside it claimed they were untracked), and
            # `git reset --mixed` left those deletions unstaged. `git rebase` refuses to run with
            # unstaged changes, so every commit this job ever made was committed locally, retried
            # five times, and thrown away - while the last step pushed the LOGS through the contents
            # API, which is how main ended up with "ci: diagnostics" commits and no data. The logs are
            # restored instead of deleted, and --autostash means a stray dirty file can never again
            # silently veto a push.
            git checkout -- _ci 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"

            # 1. Evidence first, unconditionally: the capture index and any payload the run hashed.
            git add data/captures
            if ! git diff --cached --quiet; then
              git commit -m "ci: retain $(date -u +%Y-%m-%dT%H:%M:%SZ) official captures"
            else
              echo "MARKER: no new captures"
            fi

            # 2. Derived analysis, only when it is consistent with the data it came from.
            if [ "${REBUILD_GATE:-1}" = "0" ]; then
              git add $(python3 tools/rebuild_for_refresh.py --paths)
              if ! git diff --cached --quiet; then
                git commit -m "data: refresh from official sources $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              else
                echo "MARKER: derived artefacts already current"
              fi
            else
              echo "MARKER: derived artefacts withheld (rebuild/verify gate = ${REBUILD_GATE:-unset})"
            fi

            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              if git -c rebase.autoStash=true rebase "origin/${GITHUB_REF_NAME}"; then
                if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  echo "MARKER: pushed on attempt ${attempt}"
                  pushed=1
                  break
                fi
              else
                git rebase --abort || true
                echo "MARKER: rebase refused on attempt ${attempt}; tree state follows"
                git status --porcelain
              fi
              sleep $((attempt * 5))
            done
            [ "${pushed}" = "1" ] || echo "MARKER: PUSH FAILED after 5 attempts"
            # A run that collected data and could not land it must be visible in the job, not only in
            # an artefact nobody opens.
            if [ "${pushed}" != "1" ]; then
              echo "::error::data-refresh collected official reads but could not push them; see the MARKER lines"
              exit 1
            fi
            echo "MARKER: done"
          } 2>&1 | tee /tmp/commit.log
          # The commit log is uploaded as _ci/commit.log; the two gate logs are appended to the
          # pipeline log so a single artefact carries the whole run's reasoning.
          for extra in captures rebuild; do
            if [ -s "/tmp/x1ci/${extra}.log" ]; then
              { echo "===== ${extra}.log ====="; cat "/tmp/x1ci/${extra}.log"; } >> /tmp/x1ci/pipeline.log
            fi
          done
          cp /tmp/commit.log /tmp/x1ci/commit.log
          grep -q "MARKER: done" /tmp/commit.log

      - name: Upload run logs through the API
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A rejected push must never hide the reason for it, so the logs are
          # also written with the contents API.
          for name in commit pipeline; do
            src="/tmp/x1ci/${name}.log"
            [ -f "$src" ] || echo "(no ${name} log)" > "$src"
            b64=$(base64 -w0 "$src")
            api_path="_ci/${name}.log"
            sha=$(gh api "repos/${{ github.repository }}/contents/${api_path}?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${{ github.repository }}/contents/${api_path}" \
                -f message="ci: diagnostics ${name} $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -f content="$b64" -f branch="${GITHUB_REF_NAME}" -f sha="$sha" >/dev/null
            else
              gh api -X PUT "repos/${{ github.repository }}/contents/${api_path}" \
                -f message="ci: diagnostics ${name} $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -f content="$b64" -f branch="${GITHUB_REF_NAME}" >/dev/null
            fi
          done
